# News + dip / rebalance / spot-grid (paper only, no live orders)

mode: alerts

news_dip:
  enabled: true
  symbols:
    - BTC
    - ETH
    - SOL
    - ZEC
  quote: USDT
  news_sources:
    - coindesk
    - cointelegraph
  news_window_minutes: 60
  poll_interval_seconds: 60
  dip_lookback_hours: 24
  dip_min_pct: 0.03
  dip_max_pct: 0.08
  volume_ratio_min: 0.8
  late_move_pct: 0.05
  take_profit_pct: 0.04    # also used as unattended short TP
  stop_loss_pct: 0.025     # short SL — must be an exchange order, not a dashboard hope
  time_stop_hours: 24      # close the short even if TP/SL did not fill
  risk_per_alert_pct: 0.01
  bank_usdt: 10000.0
  signal_cooldown_minutes: 120
  require_high_confidence: true
  ohlcv_timeframe: "1h"
  ohlcv_limit: 48
  enable_bear_alerts: true
  bear_late_move_pct: 0.04

# Spot grid — disabled (paper clutter; re-enable if ranging market)
spot_grid:
  enabled: false
  symbol: BTC
  levels: 10
  range_pct: 0.04          # ±2% around mid
  order_size_usdt: 50.0
  fee_bps: 10
  bank_usdt: 1000.0
  recenter_on_break: true

# Paper-test mode: news | rebalance | grid | both | all
# auto_paper stays OFF — fake shorts/rebalance fills look like live orders
strategy_test:
  enabled: true
  mode: both               # news + rebalance (grid off)
  auto_paper: false
  paper_bank_usdt: 5000.0
  max_open_positions: 5
  rebalance_paper_fraction: 0.25

assets:
  - symbol: "BTC"
    max_weight: 0.60
    min_weight: 0.0
    is_stablecoin: false
  - symbol: "ETH"
    max_weight: 0.40
    min_weight: 0.0
    is_stablecoin: false
  - symbol: "SOL"
    max_weight: 0.20
    min_weight: 0.0
    is_stablecoin: false
  - symbol: "ZEC"
    max_weight: 0.05
    min_weight: 0.0
    is_stablecoin: false
  - symbol: "USDT"
    max_weight: 1.0
    min_weight: 0.0
    is_stablecoin: true

exchange:
  name: "binance"
  sandbox: false
  dry_run: true

# BTC/Alt season → phase targets for rebalance (separate from price-structure cycle)
cycle_rebalance:
  enabled: true
  alt_index_btc_max: 25      # index < this + BTC.D rising → btc_season
  alt_index_alt_min: 75      # index > this + BTC.D falling → alt_season
  btc_d_lookback_days: 30
  btc_d_flat_band_pct: 0.3   # |Δ BTC.D| below this → flat trend
  cache_ttl_hours: 12
  min_action_usdt: 20
  no_refill:
    - AAVE
    - LINK
    - FIL
    - XRP
  thresholds_pct:
    BTC: 15
    ETH: 15
    BNB: 15
    USDT: 15
    SOL: 25
    XRP: 25
    LINK: 25
    AAVE: 25
    ZEC: 25
    FIL: 25
    PAXG: 20
  phases:
    btc_season:
      BTC: 35
      ETH: 22
      SOL: 5
      BNB: 4
      XRP: 2
      LINK: 2
      AAVE: 2
      ZEC: 2
      FIL: 1
      PAXG: 7
      USDT: 18
    neutral:
      BTC: 28
      ETH: 20
      SOL: 8
      BNB: 6
      XRP: 3
      LINK: 4
      AAVE: 4
      ZEC: 4
      FIL: 2
      PAXG: 6
      USDT: 15
    alt_season:
      BTC: 22
      ETH: 18
      SOL: 12
      BNB: 8
      XRP: 4
      LINK: 5
      AAVE: 5
      ZEC: 5
      FIL: 3
      PAXG: 5
      USDT: 13

output_dir: "out"
initial_balance: 10000.0
